<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Chat E6s</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');*{box-sizing:border-box}body{margin:0;font-family:'Nunito',Arial;background:linear-gradient(180deg,#7dd8ff,#a8f0c8 45%,#e6ffb0);min-height:100vh}#aviso{display:none;background:#ffd700;color:#000;text-align:center;padding:8px;font-weight:900;font-size:13px}.top{text-align:center;padding:10px}.top h1{margin:0;color:#fff;font-size:22px;text-shadow:0 2px 0 #2aa876}.top p{font-size:12px;background:rgba(255,255,255,.65);display:inline-block;padding:3px 10px;border-radius:20px}.canais{display:flex;gap:8px;overflow-x:auto;padding:0 12px}.canais button{white-space:nowrap;padding:8px 14px;border-radius:20px;border:1.5px solid #fff;background:rgba(255,255,255,.6);font-weight:900}.canais button.ativo{background:#00b96f;color:#fff}.canais button.premium{background:linear-gradient(180deg,#ffd700,#ff8c00);color:#fff}#box{height:52vh;margin:12px;overflow-y:auto;padding:12px;background:rgba(255,255,255,.45);border:1.5px solid #fff;border-radius:22px}.msg{background:#fff;border-radius:18px 18px 18px 4px;padding:9px 12px;margin:8px 0;max-width:92%}.msg img{max-width:100%;border-radius:12px;margin-top:6px}#panel{margin:0 12px;padding:10px;background:rgba(255,255,255,.55);border:1.5px solid #fff;border-radius:20px}.row{display:flex;gap:8px}input{flex:1;padding:12px;border-radius:14px;border:1.5px solid #b8e8d0}.botoes{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.botoes button{padding:8px 10px;border-radius:10px;border:1px solid #ddd;background:#fff;font-weight:700}button.enviar{padding:12px 16px;border:none;border-radius:14px;font-weight:900;color:#fff;background:linear-gradient(180deg,#5ee8a5,#00b96f)}</style>
<script>
function pegarAvatar(){ return localStorage.getItem('meu_avatar') || ''; }
if(!sessionStorage.getItem('chatUser')) location.href='login.html';</script>
<style>
.msg-avatar-img{width:32px;height:32px;border-radius:50%;object-fit:cover;background:#fff;flex-shrink:0;vertical-align:middle;margin-right:6px;}
</style>
</head>
<body><div id="aviso"></div><div class="top"><h1>🫧 Chat do E6s 🐠</h1><p><span id="meu"></span> <span id="selo"></span> • <a href="perfil2.html">Perfil 👤</a> • <a href="chamadas.html">📞 Chamadas</a> • <a href="#" id="admLink" style="display:none">👑 ADM</a> • <span onclick="sair()" style="cursor:pointer;text-decoration:underline">Sair</span></p></div>
<div class="canais" id="canais"></div><div id="box"></div>
<div id="panel"><div class="row"><input id="texto" placeholder="Digite..."><button class="enviar" onclick="enviar()">Enviar ➤</button></div>
<div class="botoes"><button onclick="document.getElementById('foto').click()">📷 Foto (Premium)</button><input type="file" id="foto" accept="image/*" style="display:none" onchange="enviarFoto(event)"><button onclick="mostrarGifs()">🎞️ GIF</button><button onclick="resgatar()">🎁 Resgatar Código</button></div>
<div id="gifs" style="display:none;margin-top:8px"></div></div>
<script>
let user=sessionStorage.getItem('chatUser');document.getElementById('meu').textContent='@'+user;
if(user==='izac') document.getElementById('admLink').style.display='inline';
let canais=[['geral','💬 Geral'],['jogos','🎮 Jogos'],['musica','🎵 Música'],['aero','🫧 Frutiger Aero'],['aleatorio','🤪 Aleatório'],['premium','👑 Premium']];
let atual='geral';let perfil={cor:'#008a5c',avatar:'🐠'};let isPremium=false;
let gifsList=['https://media.tenor.com/2roX3uxz_8QAAAAC/cat-dance.gif','https://media.tenor.com/8Uj0z5y8v_AAAAAC/pepe-dance.gif','https://media.tenor.com/5N2w5Z9qZ-AAAAAC/aero-water.gif','https://media.tenor.com/0t8X8Y9Z-AAAAAC/bubble.gif','https://media.tenor.com/1r2x3y4zAAAAAC/happy.gif'];
async function init(){let r=await fetch('/api/info?user='+user);let d=await r.json();isPremium=d.premium;if(isPremium) document.getElementById('selo').textContent='👑 PREMIUM';if(d.aviso){let a=document.getElementById('aviso');a.style.display='block';a.textContent='📢 '+d.aviso}let rp=await fetch('/api/perfil?user='+user);perfil=await rp.json();renderCanais();carregar();}
function renderCanais(){document.getElementById('canais').innerHTML=canais.map(c=>`<button class="${c[0]===atual?'ativo':''} ${c[0]==='premium'?'premium':''}" onclick="trocar('${c[0]}')">${c[1]}</button>`).join('')}
function trocar(ch){if(ch==='premium'&&!isPremium){alert('Só quem tem selo Premium! Resgata um código no ADM.');return;}atual=ch;renderCanais();carregar();}
async function checarAviso(){try{let r=await fetch('/api/info?user='+user);let d=await r.json();let a=document.getElementById('aviso');if(d.aviso){a.style.display='block';a.textContent='📢 '+d.aviso}else{a.style.display='none';}}catch(e){}}
async function carregar(){await checarAviso();let r=await fetch('/api/msgs?ch='+atual);let d=await r.json();document.getElementById('box').innerHTML=d.map(m=>{let selo=m.premium?' 👑':'';let conteudo=m.tipo==='img'?`<br><img src="${m.img}">`:m.tipo==='gif'?`<br><img src="${m.texto}">`:`<br><span>${m.texto}</span>`;return `<div class="msg"><b style="color:${m.cor}">${m.avatar} ${m.nome}${selo}</b>${conteudo}</div>`}).join('');let b=document.getElementById('box');b.scrollTop=99999;}
async function enviar(){let t=document.getElementById('texto').value;if(!t)return;await fetch('/api/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ch:atual,nome:user,texto:t,cor:perfil.cor,avatar:perfil.avatar,tipo:'texto'})});document.getElementById('texto').value='';carregar();}
function mostrarGifs(){let g=document.getElementById('gifs');g.style.display=g.style.display==='none'?'block':'none';g.innerHTML=gifsList.map(url=>`<img src="${url}" style="width:80px;height:80px;object-fit:cover;border-radius:10px;cursor:pointer;margin:3px" onclick="enviarGif('${url}')">`).join('')}
async function enviarGif(url){await fetch('/api/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ch:atual,nome:user,texto:url,cor:perfil.cor,avatar:perfil.avatar,tipo:'gif'})});document.getElementById('gifs').style.display='none';carregar();}
async function enviarFoto(e){if(!isPremium){alert('Fotos só pra Premium 👑');return;}let f=e.target.files[0];let reader=new FileReader();reader.onload=async()=>{await fetch('/api/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ch:atual,nome:user,cor:perfil.cor,avatar:perfil.avatar,tipo:'img',img:reader.result})});carregar();};reader.readAsDataURL(f);}
async function resgatar(){let cod=prompt('Digite o código que o ADM te deu:');if(!cod)return;let r=await fetch('/api/resgatar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user,codigo:cod})});let d=await r.json();alert(d.msg);location.reload();}
function sair(){sessionStorage.removeItem('chatUser');location.href='login.html'}
document.getElementById('texto').addEventListener('keydown',e=>{if(e.key==='Enter')enviar()});
init();setInterval(carregar,2000); setInterval(checarAviso,2000);
</script>
<script>
// CORREÇÃO FOTO NO CHAT - usa a foto salva no Perfil
setInterval(()=>{
  document.querySelectorAll('[data-avatar]').forEach(el=>{
    const av = el.getAttribute('data-avatar');
    if(av && av.startsWith('data:image') && !el.querySelector('img.msg-avatar-img')){
      const img = document.createElement('img');
      img.src = av; img.className='msg-avatar-img';
      el.prepend(img);
    }
  });
}, 500);
</script>
</body></html>
