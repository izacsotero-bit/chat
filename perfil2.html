<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Perfil - E6s</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap');*{box-sizing:border-box}body{margin:0;font-family:'Nunito',Arial;background:linear-gradient(180deg,#7dd8ff,#a8f0c8 45%,#e6ffb0);padding:15px}.card{max-width:380px;margin:20px auto;padding:20px;background:rgba(255,255,255,.6);border:1.5px solid #fff;border-radius:24px;text-align:center}input,select{width:100%;padding:12px;border-radius:14px;border:1.5px solid #b8e8d0;background:#fff;margin:6px 0}button{width:100%;padding:13px;border:none;border-radius:14px;font-weight:900;color:#fff;background:linear-gradient(180deg,#5ee8a5,#00b96f);margin-top:8px}.avatar-big{font-size:70px}.desbloq{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0}.desbloq button{width:auto;padding:8px 12px;background:#fff;color:#000;border:1.5px solid #b8e8d0}.desbloq button.selecionado{background:#00b96f;color:#fff}#bioPreview img{max-width:100%;border-radius:12px}</style>
<script>if(!sessionStorage.getItem('chatUser')) location.href='login.html';</script></head>
<body><div class="card"><div class="avatar-big" id="preview">🐠</div><h2 id="nome"></h2><p id="selo"></p>
<label>Avatar normal</label>
<!-- AVATAR FOTO DA GALERIA -->
<div style="text-align:center;">
  <img id="preview-avatar" src="https://api.dicebear.com/9.x/adventurer/svg?seed=Felix" style="width:90px;height:90px;border-radius:50%;object-fit:cover;border:3px solid #00ff88;background:#fff;">
  <br>
  <label for="input-foto" style="background:#00ff88;color:#000;padding:10px 18px;border-radius:20px;font-weight:bold;cursor:pointer;display:inline-block;margin-top:10px;">📸 Escolher foto da galeria</label>
  <input type="file" id="input-foto" accept="image/*" style="display:none;">
  <input type="hidden" id="avatar" value="">
</div>
<script>
const inputFoto = document.getElementById('input-foto');
const preview = document.getElementById('preview-avatar');
const avatarInput = document.getElementById('avatar');
const salva = localStorage.getItem('meu_avatar');
if(salva){ preview.src = salva; if(avatarInput) avatarInput.value = salva; }
if(inputFoto){
  inputFoto.addEventListener('change', function(){
    const file = this.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(e){
      const img = new Image();
      img.onload = function(){
        const canvas = document.createElement('canvas');
        const size = 150;
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        const s = Math.min(img.width, img.height);
        ctx.drawImage(img, (img.width-s)/2, (img.height-s)/2, s, s, 0, 0, size, size);
        const final = canvas.toDataURL('image/jpeg', 0.8);
        preview.src = final;
        if(avatarInput) avatarInput.value = final;
        localStorage.setItem('meu_avatar', final);
        alert('Foto salva! ✅');
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}
</script>

<div id="boxDesbloq" style="display:none"><label>🎁 Avatares Desbloqueados por Código</label><div class="desbloq" id="desbloq"></div></div>
<label>Cor do nome</label><input id="cor" type="color" value="#008a5c">
<label>Bio (Premium pode colar link de GIF)</label><input id="bio" placeholder="Ex: rei do E6s 👑 ou link .gif"><div id="bioPreview"></div>
<button onclick="salvar()">Salvar Perfil 💾</button><a href="index.html">← Voltar</a><p id="ok"></p></div>
<script>
let user=sessionStorage.getItem('chatUser');document.getElementById('nome').textContent='@'+user;let avatarAtual='🐠';
function escolherAvatar(v){avatarAtual=v;document.getElementById('preview').textContent=v;document.querySelectorAll('.desbloq button').forEach(b=>b.classList.remove('selecionado'));}
async function carregar(){
  let r=await fetch('/api/perfil?user='+user);let d=await r.json();
  let info=await (await fetch('/api/info?user='+user)).json();
  avatarAtual=d.avatar||'🐠';document.getElementById('preview').textContent=avatarAtual;
  document.getElementById('avatar').value=['🐠','🦋','🐢','🌸','👾','🦊','🐲','⭐'].includes(avatarAtual)?avatarAtual:'🐠';
  document.getElementById('cor').value=d.cor||'#008a5c';document.getElementById('bio').value=d.bio||'';
  if(info.premium) document.getElementById('selo').textContent='👑 PREMIUM - Pode usar foto, GIF na bio e canal Premium';
  else document.getElementById('selo').textContent='Sem Premium - Resgata um código!';
  if(info.meus_avatars && info.meus_avatars.length>0){
    document.getElementById('boxDesbloq').style.display='block';
    document.getElementById('desbloq').innerHTML=info.meus_avatars.map(a=>{
      let isImg=a.startsWith('http');
      let label=isImg?`<img src="${a}" style="width:30px;height:30px;border-radius:50%;object-fit:cover">`:a;
      return `<button class="${a===avatarAtual?'selecionado':''}" onclick="escolherAvatar('${a}');document.getElementById('preview').innerHTML='${isImg?`<img src=&quot;${a}&quot; style=&quot;width:70px;height:70px;border-radius:50%;object-fit:cover&quot;>':'${a}'}'">${label}</button>`
    }).join('');
  }
  if((d.bio||'').includes('.gif')) document.getElementById('bioPreview').innerHTML=`<img src="${d.bio}">`;
}
async function salvar(){let bio=document.getElementById('bio').value;await fetch('/api/perfil',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user,avatar:avatarAtual,cor:document.getElementById('cor').value,bio})});document.getElementById('ok').textContent='✅ Salvo! Agora vai pro chat e vê teu avatar novo.';}
carregar();
</script></body></html>
