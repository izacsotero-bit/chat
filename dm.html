<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>DM - E6s</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');*{box-sizing:border-box}body{margin:0;font-family:'Nunito',Arial;background:linear-gradient(180deg,#7dd8ff,#a8f0c8 45%,#e6ffb0);min-height:100vh}.top{text-align:center;padding:12px}.top h1{margin:0;color:#fff;font-size:22px;text-shadow:0 2px 0 #2aa876}.top p{font-size:12px;background:rgba(255,255,255,.65);display:inline-block;padding:3px 10px;border-radius:20px}.lista{display:flex;gap:8px;overflow-x:auto;padding:0 12px}.lista button{white-space:nowrap;padding:8px 14px;border-radius:20px;border:1.5px solid #fff;background:rgba(255,255,255,.6);font-weight:900}.lista button.ativo{background:#6a5acd;color:#fff}#box{height:55vh;margin:12px;overflow-y:auto;padding:12px;background:rgba(255,255,255,.45);border:1.5px solid #fff;border-radius:22px}.msg{background:#fff;border-radius:18px 18px 18px 4px;padding:9px 12px;margin:8px 0;max-width:92%}.msg.eu{background:linear-gradient(180deg,#d9f9ff,#fff);margin-left:auto;border-radius:18px 18px 4px 18px}.msg img{max-width:100%;border-radius:12px}#panel{margin:0 12px;padding:10px;background:rgba(255,255,255,.55);border:1.5px solid #fff;border-radius:20px}.row{display:flex;gap:8px}input{flex:1;padding:12px;border-radius:14px;border:1.5px solid #b8e8d0}button.enviar{padding:12px 16px;border:none;border-radius:14px;font-weight:900;color:#fff;background:linear-gradient(180deg,#a78bfa,#6a5acd)}</style>
<script>if(!sessionStorage.getItem('chatUser')) location.href='login.html';</script></head>
<body><div class="top"><h1>🔒 DM Privado</h1><p>Logado como <b id="meu"></b> • <a href="index.html">Chat Geral</a> • <a href="chamadas.html">📞 Chamadas</a></p></div>
<div class="lista" id="lista"></div><p id="vazio" style="text-align:center;font-size:13px">👆 Escolhe alguém pra conversar</p>
<div id="box" style="display:none"></div>
<div id="panel" style="display:none"><div class="row"><input id="texto" placeholder="Mensagem privada..."><button class="enviar" onclick="enviar()">Enviar ➤</button></div><div style="display:flex;gap:6px;margin-top:8px"><button onclick="document.getElementById('foto').click()">📷 Foto</button><input type="file" id="foto" accept="image/*" style="display:none" onchange="enviarFoto(event)"><button onclick="mostrarGifs()">🎞️ GIF</button></div><div id="gifs" style="display:none"></div></div>
<script>
let user=sessionStorage.getItem('chatUser');document.getElementById('meu').textContent='@'+user;
let para='';let perfil={cor:'#008a5c',avatar:'🐠'};
let gifsList=['https://media.tenor.com/2roX3uxz_8QAAAAC/cat-dance.gif','https://media.tenor.com/8Uj0z5y8v_AAAAAC/pepe-dance.gif','https://media.tenor.com/1r2x3y4zAAAAAC/happy.gif'];
async function init(){let r=await fetch('/api/perfil?user='+user);perfil=await r.json();let ru=await fetch('/api/users?me='+user);let users=await ru.json();document.getElementById('lista').innerHTML=users.map(u=>`<button onclick="abrir('${u}')" id="btn-${u}">👤 @${u}</button>`).join('')||'<p style="padding:10px">Ninguém ainda, espera alguém criar conta!</p>';}
function abrir(u){para=u;document.querySelectorAll('.lista button').forEach(b=>b.classList.remove('ativo'));let b=document.getElementById('btn-'+u);if(b)b.classList.add('ativo');document.getElementById('vazio').style.display='none';document.getElementById('box').style.display='block';document.getElementById('panel').style.display='block';carregar();}
async function carregar(){if(!para)return;let r=await fetch(`/api/dm?a=${user}&b=${para}`);let d=await r.json();document.getElementById('box').innerHTML=d.map(m=>{let conteudo=m.tipo==='img'?`<br><img src="${m.img}">`:m.tipo==='gif'?`<br><img src="${m.texto}">`:`<br><span>${m.texto}</span>`;return `<div class="msg ${m.nome===user?'eu':''}"><b style="color:${m.cor}">${m.avatar} ${m.nome}${m.premium?' 👑':''}</b>${conteudo}</div>`}).join('');let b=document.getElementById('box');b.scrollTop=99999;}
async function enviar(){let t=document.getElementById('texto').value;if(!t||!para)return;await fetch('/api/dm/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({de:user,para,texto:t,cor:perfil.cor,avatar:perfil.avatar,tipo:'texto'})});document.getElementById('texto').value='';carregar();}
function mostrarGifs(){let g=document.getElementById('gifs');g.style.display=g.style.display==='none'?'block':'none';g.innerHTML=gifsList.map(url=>`<img src="${url}" style="width:80px;height:80px;object-fit:cover;border-radius:10px;cursor:pointer;margin:3px" onclick="enviarGif('${url}')">`).join('')}
async function enviarGif(url){await fetch('/api/dm/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({de:user,para,texto:url,cor:perfil.cor,avatar:perfil.avatar,tipo:'gif'})});document.getElementById('gifs').style.display='none';carregar();}
async function enviarFoto(e){let f=e.target.files[0];let reader=new FileReader();reader.onload=async()=>{await fetch('/api/dm/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({de:user,para,cor:perfil.cor,avatar:perfil.avatar,tipo:'img',img:reader.result})});carregar();};reader.readAsDataURL(f);}
document.getElementById('texto').addEventListener('keydown',e=>{if(e.key==='Enter')enviar()});
init();setInterval(carregar,2000);
</script></body></html>
